name: Process Compatibility Reports

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

jobs:
  process-reports:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.label.name == 'compat-report')
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Checkout or create compat-data branch
        run: |
          git fetch origin compat-data:compat-data 2>/dev/null || \
            git checkout --orphan compat-data && \
            git rm -rf . && \
            git commit --allow-empty -m "Initialize compat-data branch"
          git checkout compat-data

      - name: Process compatibility reports
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd $GITHUB_WORKSPACE
          git checkout main -- .github/scripts
          cd .github/scripts
          npm ci
          node process-compat-reports.js

      - name: Commit compatibility data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add compat/compatibility.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update compatibility data [skip ci]"
            git push origin compat-data
          fi
