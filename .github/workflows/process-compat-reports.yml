name: Process Compatibility Reports

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

jobs:
  process-reports:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && 
       (github.event.label.name == 'compat-report' || 
        contains(github.event.issue.title, '[compat]')))
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Checkout or create compat-data branch
        run: |
          # Create a separate worktree for compat-data to avoid disrupting main checkout
          mkdir -p /tmp/compat-data-work
          
          if git fetch origin compat-data 2>/dev/null; then
            # Branch exists, check it out in the worktree
            git worktree add /tmp/compat-data-work compat-data
          else
            # Branch doesn't exist, create it as orphan
            git worktree add --detach /tmp/compat-data-work
            cd /tmp/compat-data-work
            git checkout --orphan compat-data
            git rm -rf . 2>/dev/null || true
            git commit --allow-empty -m "Initialize compat-data branch"
            git push origin compat-data
          fi

      - name: Ensure compat-report label exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create compat-report \
            --description "Community compatibility report" \
            --color "0E8A16" \
            --force || true

      - name: Process compatibility reports
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd $GITHUB_WORKSPACE
          cp -r .github/scripts /tmp/scripts-copy
          cd /tmp/scripts-copy
          npm ci
          node process-compat-reports.js
          
          # Copy results to compat-data worktree
          mkdir -p /tmp/compat-data-work/compat
          cp compat/compatibility.json /tmp/compat-data-work/compat/compatibility.json

      - name: Commit compatibility data
        run: |
          cd /tmp/compat-data-work
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add compat/compatibility.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update compatibility data [skip ci]"
            git push origin compat-data
          fi
